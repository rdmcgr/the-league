name: Deploy to Bluehost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: box5379.bluehost.com
      REMOTE_USER: redkingt
      REMOTE_PORT: 22
      TARGET_PATH: public_html/hosted/the-league/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          BLUEHOST_SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BLUEHOST_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        run: |
          ssh -i ~/.ssh/id_rsa -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$TARGET_PATH'"

      - name: Sync site to Bluehost
        run: |
          rsync -rlgoDzvc --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='Season Win Tracker 02282026.xlsx' \
            --exclude='scripts/' \
            --exclude='data/poll-votes.json' \
            --exclude='data/futures-runtime.json' \
            -e "ssh -i ~/.ssh/id_rsa -p $REMOTE_PORT" \
            ./ "$REMOTE_USER@$REMOTE_HOST:$TARGET_PATH"
